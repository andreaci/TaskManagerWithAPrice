name: Build and release

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore TaskCost.csproj --runtime win-x64

      - name: Build
        run: dotnet build TaskCost.csproj --configuration Release --no-restore

      - name: Publish self-contained application
        run: >-
          dotnet publish TaskCost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath TaskCost-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskCost-win-x64
          path: TaskCost-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged application
        uses: actions/download-artifact@v6
        with:
          name: TaskCost-win-x64

      - name: Create release and upload application
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          TaskCost-win-x64.zip
          --verify-tag
          --generate-notes
          --latest
