name: Build and release

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release_metadata:
    name: Detect release version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Read version from tag or commit message
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=""

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] &&
               [[ "$COMMIT_MESSAGE" =~ (^|[^[:alnum:].])(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)([^[:alnum:].-]|$) ]]; then
            version="${BASH_REMATCH[2]}"
          fi

          if [[ -n "$version" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Release requested for $version"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No release version found"
          fi

  build:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore TaskCost.csproj --runtime win-x64

      - name: Build
        run: dotnet build TaskCost.csproj --configuration Release --no-restore

      - name: Publish self-contained application
        run: >-
          dotnet publish TaskCost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify single executable output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path publish/win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'TaskCost.exe') {
            throw "Expected exactly one TaskCost.exe, found: $($files.Name -join ', ')"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: TaskCost-win-x64
          path: publish/win-x64/TaskCost.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: needs.release_metadata.outputs.should_release == 'true'
    needs: [build, release_metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packaged application
        uses: actions/download-artifact@v6
        with:
          name: TaskCost-win-x64

      - name: Create version tag when needed
        env:
          VERSION: ${{ needs.release_metadata.outputs.version }}
        shell: bash
        run: |
          git fetch --force --tags
          existing_commit="$(git rev-list -n 1 "$VERSION" 2>/dev/null || true)"

          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $VERSION already points to $existing_commit, not $GITHUB_SHA" >&2
            exit 1
          fi

          if [[ -z "$existing_commit" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Create release and upload application
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_metadata.outputs.version }}
        run: >-
          gh release create "$VERSION"
          TaskCost.exe
          --verify-tag
          --generate-notes
          --latest
